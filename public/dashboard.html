<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alertas do Dia — Ouro Verde</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f4;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #1a6b3a;
      color: #fff;
      padding: 28px 24px 22px;
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      font-weight: 700;
    }

    header nav {
      margin-top: 10px;
    }

    header nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 4px 12px;
      border-radius: 20px;
      transition: background 0.2s;
    }

    header nav a:hover { background: rgba(255,255,255,0.15); }

    main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .toolbar span {
      font-size: 0.85rem;
      color: #666;
    }

    .btn-atualizar {
      padding: 9px 22px;
      background: #1a6b3a;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-atualizar:hover:not(:disabled) { background: #155530; }
    .btn-atualizar:disabled { opacity: 0.55; cursor: not-allowed; }

    .spinner-inline {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .secao {
      margin-bottom: 28px;
    }

    .secao-titulo {
      font-size: 1rem;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .secao-titulo .contagem {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: auto;
    }

    .alerta .secao-titulo  { background: #fdecea; color: #b71c1c; border: 1.5px solid #f5c6c2; border-bottom: none; }
    .alerta .contagem      { background: #b71c1c; color: #fff; }

    .atencao .secao-titulo { background: #fffde7; color: #7a5f00; border: 1.5px solid #ffe082; border-bottom: none; }
    .atencao .contagem     { background: #f59f00; color: #fff; }

    .ok .secao-titulo      { background: #e8f5e9; color: #1b5e20; border: 1.5px solid #a5d6a7; border-bottom: none; }
    .ok .contagem          { background: #2e7d32; color: #fff; }

    .lista-cards {
      border-radius: 0 0 8px 8px;
      overflow: hidden;
    }

    .alerta  .lista-cards { border: 1.5px solid #f5c6c2; border-top: none; }
    .atencao .lista-cards { border: 1.5px solid #ffe082; border-top: none; }
    .ok      .lista-cards { border: 1.5px solid #a5d6a7; border-top: none; }

    .deal-card {
      background: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #eee;
    }

    .deal-card:last-child { border-bottom: none; }

    .deal-info { flex: 1; min-width: 180px; }

    .deal-nome {
      font-weight: 700;
      font-size: 0.97rem;
      line-height: 1.3;
    }

    .deal-meta {
      margin-top: 4px;
      font-size: 0.82rem;
      color: #555;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .deal-prazo {
      font-weight: 600;
      white-space: nowrap;
    }

    .prazo-alerta  { color: #c0392b; }
    .prazo-atencao { color: #9a6c00; }
    .prazo-ok      { color: #1a6b3a; }

    .deal-valor {
      font-size: 0.88rem;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
    }

    .btn-analisar {
      padding: 7px 16px;
      background: #1a6b3a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-analisar:hover { background: #155530; }

    .vazio {
      background: #fff;
      padding: 14px 16px;
      font-size: 0.88rem;
      color: #888;
      font-style: italic;
    }

    #erro-msg {
      display: none;
      background: #fdecea;
      border: 1px solid #f5c6c2;
      color: #b71c1c;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.93rem;
    }

    @media (max-width: 480px) {
      .deal-card { flex-direction: column; align-items: flex-start; }
      .btn-analisar { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

<header>
  <h1>Alertas do Dia — Ouro Verde</h1>
  <nav><a href="/">Assistente Comercial</a></nav>
</header>

<main>
  <div class="toolbar">
    <span id="ultima-atualizacao">Carregando...</span>
    <button class="btn-atualizar" id="btn-atualizar" onclick="carregar()">Atualizar</button>
  </div>

  <div id="erro-msg"></div>

  <div class="secao alerta">
    <div class="secao-titulo">🚨 REQUER AÇÃO AGORA <span class="contagem" id="ct-alerta">0</span></div>
    <div class="lista-cards" id="lista-alerta"><div class="vazio">Nenhum negócio em alerta.</div></div>
  </div>

  <div class="secao atencao">
    <div class="secao-titulo">⚠ ATENÇÃO <span class="contagem" id="ct-atencao">0</span></div>
    <div class="lista-cards" id="lista-atencao"><div class="vazio">Nenhum negócio no limite.</div></div>
  </div>

  <div class="secao ok">
    <div class="secao-titulo">✅ EM DIA <span class="contagem" id="ct-ok">0</span></div>
    <div class="lista-cards" id="lista-ok"><div class="vazio">Nenhum negócio em dia.</div></div>
  </div>
</main>

<script>
  function formatarValor(valor, moeda) {
    if (!valor && valor !== 0) return '—';
    return new Intl.NumberFormat('pt-BR', {
      style: 'currency',
      currency: moeda || 'BRL',
      minimumFractionDigits: 0,
    }).format(valor);
  }

  function dadosParaAnalise(deal) {
    const prazoEtapa = deal.prazoMax
      ? `${deal.diasNaEtapa} dias / máx ${deal.prazoMax}`
      : `${deal.diasNaEtapa} dias`;
    const atividade = deal.diasSemAtividade !== null
      ? `${deal.diasSemAtividade} dias atrás`
      : 'Sem registro';
    const statusLabel = deal.status === 'alerta' ? 'ACIMA DO PRAZO' : deal.status === 'atencao' ? 'CHEGANDO NO LIMITE' : 'EM DIA';
    return `Negócio: ${deal.nome}\nEtapa: ${deal.etapa}\nDias na etapa: ${prazoEtapa}\nÚltima atividade: ${atividade}\nValor: ${formatarValor(deal.valor, deal.moeda)}\nStatus: ${statusLabel}`;
  }

  function renderizarCard(deal) {
    const prazoClass = deal.status === 'alerta' ? 'prazo-alerta' : deal.status === 'atencao' ? 'prazo-atencao' : 'prazo-ok';

    const etapaTexto = deal.prazoMax
      ? `${deal.diasNaEtapa} dias na etapa / máx ${deal.prazoMax}`
      : `${deal.diasNaEtapa} dias na etapa`;

    const atividadeTexto = deal.diasSemAtividade !== null
      ? `Última atividade: ${deal.diasSemAtividade} dias atrás`
      : 'Sem atividade registrada';

    const dados = encodeURIComponent(dadosParaAnalise(deal));

    const card = document.createElement('div');
    card.className = 'deal-card';
    card.innerHTML = `
      <div class="deal-info">
        <div class="deal-nome">${deal.nome}</div>
        <div class="deal-meta">
          <span>${deal.etapa || '—'}</span>
          <span>${etapaTexto}</span>
          <span class="deal-prazo ${prazoClass}">${atividadeTexto}</span>
        </div>
      </div>
      <div class="deal-valor">${formatarValor(deal.valor, deal.moeda)}</div>
      <button class="btn-analisar" onclick="window.location.href='/?dados=${dados}'">Analisar</button>
    `;
    return card;
  }

  async function carregar() {
    const btn = document.getElementById('btn-atualizar');
    const erroDiv = document.getElementById('erro-msg');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-inline"></span>Atualizando...';
    erroDiv.style.display = 'none';

    ['alerta', 'atencao', 'ok'].forEach(s => {
      document.getElementById(`lista-${s}`).innerHTML = '<div class="vazio">Carregando...</div>';
      document.getElementById(`ct-${s}`).textContent = '0';
    });

    try {
      const resp = await fetch('/dashboard');
      const json = await resp.json();

      if (!resp.ok || json.erro) {
        erroDiv.textContent = json.erro || 'Erro ao carregar dados.';
        erroDiv.style.display = 'block';
        return;
      }

      const grupos = { alerta: [], atencao: [], ok: [] };
      for (const deal of json.oportunidades) {
        grupos[deal.status]?.push(deal);
      }

      for (const [status, lista] of Object.entries(grupos)) {
        const container = document.getElementById(`lista-${status}`);
        document.getElementById(`ct-${status}`).textContent = lista.length;
        if (lista.length === 0) {
          const msg = { alerta: 'Nenhum negócio em alerta.', atencao: 'Nenhum negócio no limite.', ok: 'Nenhum negócio em dia.' };
          container.innerHTML = `<div class="vazio">${msg[status]}</div>`;
        } else {
          container.innerHTML = '';
          lista.forEach(deal => container.appendChild(renderizarCard(deal)));
        }
      }

      document.getElementById('ultima-atualizacao').textContent =
        `Atualizado às ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} — ${json.oportunidades.length} negócios`;

    } catch (err) {
      erroDiv.textContent = 'Falha de conexão com o servidor.';
      erroDiv.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Atualizar';
    }
  }

  carregar();
</script>

</body>
</html>
