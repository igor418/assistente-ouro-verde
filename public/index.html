<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente Comercial — Ouro Verde</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f4;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #1a6b3a;
      color: #fff;
      padding: 28px 24px 22px;
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    header p {
      margin-top: 6px;
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      opacity: 0.88;
      letter-spacing: 0.03em;
    }

    main {
      max-width: 820px;
      margin: 36px auto;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 28px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #2a2a2a;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px 14px;
      border: 1.5px solid #c8d5c8;
      border-radius: 7px;
      font-size: 0.93rem;
      line-height: 1.55;
      resize: vertical;
      transition: border-color 0.2s;
      background: #fafcfa;
    }

    textarea:focus {
      outline: none;
      border-color: #1a6b3a;
      background: #fff;
    }

    button {
      margin-top: 16px;
      padding: 11px 32px;
      background: #1a6b3a;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) { background: #155530; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    #loading {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      color: #1a6b3a;
      font-weight: 500;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #c8d5c8;
      border-top-color: #1a6b3a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #resultado-section { display: none; }

    #resultado-section h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1a6b3a;
    }

    #resultado {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 0.95rem;
      color: #1a1a1a;
    }

    .erro { color: #c0392b; }

    @media (max-width: 480px) {
      .card { padding: 20px 16px; }
      button { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>Assistente Comercial — Ouro Verde</h1>
  <p>Funil [COMERCIAL] VENDAS GRUPOS PGRS/SAV/ETC</p>
  <nav style="margin-top:10px;">
    <a href="/dashboard.html" style="color:rgba(255,255,255,0.85);text-decoration:none;font-size:0.88rem;border:1px solid rgba(255,255,255,0.4);padding:4px 12px;border-radius:20px;">Ver Alertas do Dia</a>
    <a href="/triagem.html" style="color:rgba(255,255,255,0.85);text-decoration:none;font-size:0.88rem;border:1px solid rgba(255,255,255,0.4);padding:4px 12px;border-radius:20px;">Triagem do funil</a>
  </nav>
</header>

<main>
  <div class="card">
    <label for="dados">Cole os dados para análise:</label>
    <textarea id="dados" placeholder="Cole aqui os dados do funil, interações, notas de clientes..."></textarea>
    <button id="btn-analisar" onclick="analisar()">Analisar</button>
    <div id="loading">
      <div class="spinner"></div>
      <span>Analisando, aguarde...</span>
    </div>
  </div>

  <div class="card" id="resultado-section">
    <h2>Análise</h2>
    <div id="resultado"></div>
  </div>
</main>

<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const dados = params.get('dados');
    if (dados) document.getElementById('dados').value = dados;
  })();

  async function analisar() {
    const dados = document.getElementById('dados').value.trim();
    if (!dados) {
      alert('Por favor, cole os dados antes de analisar.');
      return;
    }

    const btn = document.getElementById('btn-analisar');
    const loading = document.getElementById('loading');
    const section = document.getElementById('resultado-section');
    const resultado = document.getElementById('resultado');

    btn.disabled = true;
    loading.style.display = 'flex';
    section.style.display = 'none';
    resultado.textContent = '';
    resultado.className = '';

    try {
      const resp = await fetch('/analisar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dados }),
      });

      const json = await resp.json();

      if (!resp.ok || json.erro) {
        resultado.textContent = json.erro || 'Erro desconhecido.';
        resultado.className = 'erro';
      } else {
        resultado.textContent = json.analise;
      }
    } catch (err) {
      resultado.textContent = 'Falha de conexão com o servidor.';
      resultado.className = 'erro';
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
      section.style.display = 'block';
    }
  }
</script>

</body>
</html>
