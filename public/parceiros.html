<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parceiros Oficiais — Ouro Verde</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f4;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #1a6b3a;
      color: #fff;
      padding: 28px 24px 22px;
      text-align: center;
    }
    header h1 { font-size: clamp(1.3rem, 4vw, 1.9rem); font-weight: 700; }
    header nav { margin-top: 10px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    header nav a {
      color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.4); padding: 4px 12px; border-radius: 20px;
      transition: background 0.2s;
    }
    header nav a:hover { background: rgba(255,255,255,0.15); }

    main { max-width: 920px; margin: 28px auto; padding: 0 16px; }

    .metricas {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .metrica {
      background: #fff;
      border-radius: 10px;
      padding: 14px 10px;
      text-align: center;
      border-top: 4px solid;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .metrica:hover { transform: translateY(-2px); }
    .metrica.assinar   { border-color: #dc2626; }
    .metrica.negoc     { border-color: #d97706; }
    .metrica.frio      { border-color: #2563eb; }
    .metrica.assinado  { border-color: #155530; }
    .metrica-num { font-size: 1.8rem; font-weight: 800; line-height: 1; }
    .metrica.assinar  .metrica-num { color: #dc2626; }
    .metrica.negoc    .metrica-num { color: #d97706; }
    .metrica.frio     .metrica-num { color: #2563eb; }
    .metrica.assinado .metrica-num { color: #155530; }
    .metrica-label { font-size: 0.7rem; font-weight: 600; color: #555; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.03em; }

    .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .filtro {
      padding: 7px 16px; border-radius: 20px; border: 1.5px solid #ccc;
      background: #fff; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s; color: #444;
    }
    .filtro:hover { border-color: #1a6b3a; color: #1a6b3a; }
    .filtro.ativo { background: #1a6b3a; color: #fff; border-color: #1a6b3a; }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
    }
    .toolbar span { font-size: 0.85rem; color: #666; }
    .btn-atualizar {
      padding: 8px 20px; background: #1a6b3a; color: #fff; border: none;
      border-radius: 7px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-atualizar:hover:not(:disabled) { background: #155530; }
    .btn-atualizar:disabled { opacity: 0.55; cursor: not-allowed; }

    .spinner-inline {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #lista-cards { display: flex; flex-direction: column; gap: 10px; }

    .deal-card {
      background: #fff;
      border-radius: 8px;
      border-left: 5px solid;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      overflow: hidden;
    }
    .deal-card[data-cat="ASSINAR_AGORA"]     { border-color: #dc2626; }
    .deal-card[data-cat="NEGOCIANDO"]        { border-color: #d97706; }
    .deal-card[data-cat="FRIO"]              { border-color: #2563eb; }
    .deal-card[data-cat="CONTRATO_ASSINADO"] { border-color: #155530; }

    .deal-body {
      padding: 14px 16px;
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .deal-info { flex: 1; min-width: 200px; }
    .deal-nome { font-weight: 700; font-size: 0.97rem; line-height: 1.3; }
    .deal-meta {
      margin-top: 5px; font-size: 0.81rem; color: #555;
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .dias-destaque { font-weight: 700; }
    .deal-card[data-cat="ASSINAR_AGORA"]     .dias-destaque { color: #dc2626; }
    .deal-card[data-cat="NEGOCIANDO"]        .dias-destaque { color: #d97706; }
    .deal-card[data-cat="FRIO"]              .dias-destaque { color: #2563eb; }
    .deal-card[data-cat="CONTRATO_ASSINADO"] .dias-destaque { color: #155530; }

    .deal-acoes { display: flex; gap: 8px; }
    .btn-estrategia {
      padding: 6px 14px; background: #1a6b3a; color: #fff; border: none;
      border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s; white-space: nowrap;
    }
    .btn-estrategia:hover:not(:disabled) { background: #155530; }
    .btn-estrategia:disabled { opacity: 0.55; cursor: not-allowed; }

    .estrategia-panel {
      display: none;
      padding: 12px 16px 14px;
      border-top: 1px solid #eee;
      background: #fafcfa;
      font-size: 0.88rem;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #1a1a1a;
    }
    .estrategia-panel.visivel { display: block; }
    .estrategia-panel.erro { color: #c0392b; }

    .aviso { text-align: center; color: #888; font-size: 0.93rem; padding: 40px 0; font-style: italic; }
    #erro-global {
      display: none; background: #fdecea; border: 1px solid #f5c6c2;
      color: #b71c1c; padding: 14px 18px; border-radius: 8px;
      margin-bottom: 16px; font-size: 0.93rem;
    }

    @media (max-width: 600px) {
      .metricas { grid-template-columns: repeat(2, 1fr); }
      .deal-body { flex-direction: column; align-items: flex-start; }
      .btn-estrategia { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

<header>
  <h1>Parceiros Oficiais — Ouro Verde</h1>
  <nav>
    <a href="/">Início</a>
    <a href="/triagem.html">Triagem do Funil</a>
  </nav>
</header>

<main>
  <div class="metricas">
    <div class="metrica assinar" onclick="filtrar('ASSINAR_AGORA')">
      <div class="metrica-num" id="ct-ASSINAR_AGORA">—</div>
      <div class="metrica-label">Assinar agora</div>
    </div>
    <div class="metrica negoc" onclick="filtrar('NEGOCIANDO')">
      <div class="metrica-num" id="ct-NEGOCIANDO">—</div>
      <div class="metrica-label">Negociando</div>
    </div>
    <div class="metrica frio" onclick="filtrar('FRIO')">
      <div class="metrica-num" id="ct-FRIO">—</div>
      <div class="metrica-label">Frio</div>
    </div>
    <div class="metrica assinado" onclick="filtrar('CONTRATO_ASSINADO')">
      <div class="metrica-num" id="ct-CONTRATO_ASSINADO">—</div>
      <div class="metrica-label">Contrato assinado</div>
    </div>
  </div>

  <div class="filtros">
    <button class="filtro ativo" data-cat="todos" onclick="filtrar('todos')">Todos</button>
    <button class="filtro" data-cat="ASSINAR_AGORA" onclick="filtrar('ASSINAR_AGORA')">Assinar agora</button>
    <button class="filtro" data-cat="NEGOCIANDO" onclick="filtrar('NEGOCIANDO')">Negociando</button>
    <button class="filtro" data-cat="FRIO" onclick="filtrar('FRIO')">Frio</button>
    <button class="filtro" data-cat="CONTRATO_ASSINADO" onclick="filtrar('CONTRATO_ASSINADO')">Contrato assinado</button>
  </div>

  <div class="toolbar">
    <span id="status-txt">Carregando...</span>
    <button class="btn-atualizar" id="btn-atualizar" onclick="carregar()">Atualizar</button>
  </div>

  <div id="erro-global"></div>
  <div id="lista-cards"></div>
</main>

<script>
  const LABEL = {
    ASSINAR_AGORA:     'Assinar agora',
    NEGOCIANDO:        'Negociando',
    FRIO:              'Frio',
    CONTRATO_ASSINADO: 'Contrato assinado',
  };

  let todosDados = [];
  let filtroAtivo = 'todos';

  function inferirTipo(orgNome) {
    if (!orgNome) return null;
    const n = orgNome.toLowerCase();
    if (n.includes('sindicato') || n.includes('sincodiv')) return 'Sindicato';
    if (n.includes('associa')) return 'Associação';
    if (n.includes('concession')) return 'Concessionária';
    if (n.includes('cooperativa') || n.includes('coop')) return 'Cooperativa';
    return null;
  }

  function criarCard(deal) {
    const card = document.createElement('div');
    card.className = 'deal-card';
    card.dataset.cat = deal.categoria;
    card.dataset.id = deal.id;

    const tipo = inferirTipo(deal.orgNome);
    const tipoTexto = tipo || deal.orgNome || '';
    const orgLinha = tipoTexto ? `<span>${tipoTexto}</span>` : '';

    card.innerHTML = `
      <div class="deal-body">
        <div class="deal-info">
          <div class="deal-nome">${deal.nome}</div>
          <div class="deal-meta">
            ${orgLinha}
            <span class="dias-destaque">${deal.diasSemAtividade} dias sem atividade</span>
            <span>${deal.etapa || '—'}</span>
          </div>
        </div>
        <div class="deal-acoes">
          <button class="btn-estrategia" onclick="verEstrategia(this)">Ver estratégia</button>
        </div>
      </div>
      <div class="estrategia-panel"></div>
    `;
    return card;
  }

  function renderizar(lista) {
    const container = document.getElementById('lista-cards');
    container.innerHTML = '';
    if (!lista.length) {
      container.innerHTML = '<div class="aviso">Nenhum parceiro nesta categoria.</div>';
      return;
    }
    lista.forEach(deal => container.appendChild(criarCard(deal)));
  }

  function filtrar(cat) {
    filtroAtivo = cat;
    document.querySelectorAll('.filtro').forEach(b => b.classList.toggle('ativo', b.dataset.cat === cat));
    renderizar(cat === 'todos' ? todosDados : todosDados.filter(d => d.categoria === cat));
  }

  async function carregar() {
    const btn = document.getElementById('btn-atualizar');
    const erroDiv = document.getElementById('erro-global');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-inline"></span>Atualizando...';
    erroDiv.style.display = 'none';
    document.getElementById('lista-cards').innerHTML = '<div class="aviso">Carregando...</div>';

    try {
      const resp = await fetch('/parceiros');
      const json = await resp.json();

      if (!resp.ok || json.erro) {
        erroDiv.textContent = json.erro || 'Erro ao carregar dados.';
        erroDiv.style.display = 'block';
        return;
      }

      const cats = ['ASSINAR_AGORA', 'NEGOCIANDO', 'FRIO', 'CONTRATO_ASSINADO'];
      todosDados = cats.flatMap(c => json[c] || []);

      cats.forEach(c => document.getElementById(`ct-${c}`).textContent = (json[c] || []).length);

      document.getElementById('status-txt').textContent =
        `Atualizado às ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} — ${todosDados.length} parceiros`;

      filtrar(filtroAtivo);
    } catch (err) {
      erroDiv.textContent = 'Falha de conexão com o servidor.';
      erroDiv.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Atualizar';
    }
  }

  async function verEstrategia(btn) {
    const card = btn.closest('.deal-card');
    const panel = card.querySelector('.estrategia-panel');
    const id = parseInt(card.dataset.id);
    const deal = todosDados.find(d => d.id === id);

    if (panel.classList.contains('visivel')) {
      panel.classList.remove('visivel');
      btn.textContent = 'Ver estratégia';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-inline" style="border-top-color:#fff"></span>Gerando...';
    panel.textContent = '';
    panel.className = 'estrategia-panel';

    try {
      const resp = await fetch('/estrategia-parceiro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ negocio: deal.nome, categoria: deal.categoria }),
      });
      const json = await resp.json();

      panel.textContent = (!resp.ok || json.erro) ? (json.erro || 'Erro.') : json.estrategia;
      if (!resp.ok || json.erro) panel.classList.add('erro');
      panel.classList.add('visivel');
      btn.textContent = 'Fechar';
    } catch {
      panel.textContent = 'Falha de conexão.';
      panel.classList.add('erro', 'visivel');
      btn.textContent = 'Fechar';
    } finally {
      btn.disabled = false;
    }
  }

  carregar();
</script>

</body>
</html>
